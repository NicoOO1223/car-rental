name: Database backup & restore drill

on:
  schedule:
    # Daily, off the hour to avoid the top-of-hour scheduling crowd on GH Actions.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  # Every stack has its own database, storage and login, so each is backed up
  # and drilled inside its own GitHub Environment (stack-<slug>).
  plan:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.stacks.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4

      - id: stacks
        run: echo "stacks=$(jq -s -c '[.[].slug]' deploy/stacks/*.json)" >> "$GITHUB_OUTPUT"

  backup:
    needs: plan
    runs-on: ubuntu-latest
    environment: stack-${{ matrix.stack }}
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.plan.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The database only accepts Azure services, so this runner's address is
      # let in for the length of the job and removed again at the end.
      - name: Open database firewall for this runner
        env:
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
        run: |
          runner_ip=$(curl -fsS https://api.ipify.org)
          echo "Allowing runner IP $runner_ip"
          az postgres flexible-server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "${POSTGRES_HOST%%.*}" \
            --name "gha-backup-${{ github.run_id }}" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip"

      - name: Dump and upload backup
        env:
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          POSTGRES_ADMIN_USER: ${{ vars.POSTGRES_ADMIN_USER }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          POSTGRES_DB_NAME: ${{ vars.POSTGRES_DB_NAME }}
          BACKUP_STORAGE_ACCOUNT: ${{ vars.BACKUP_STORAGE_ACCOUNT }}
          BACKUP_CONTAINER_NAME: ${{ vars.BACKUP_CONTAINER_NAME }}
        run: bash deploy/backup/backup.sh

      - name: Close database firewall for this runner
        if: always()
        env:
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "${POSTGRES_HOST%%.*}" \
            --name "gha-backup-${{ github.run_id }}" \
            --yes || true

  # Proves the backup that's actually sitting in storage right now is
  # restorable — restores into a throwaway container on the runner, never
  # into production. Runs the same day as the backup so a broken backup is
  # caught with zero lag.
  restore-drill:
    needs: [plan, backup]
    runs-on: ubuntu-latest
    environment: stack-${{ matrix.stack }}
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.plan.outputs.stacks) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: car_rental_test
          POSTGRES_USER: car_rental
          POSTGRES_PASSWORD: car_rental_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U car_rental"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://car_rental:car_rental_dev@localhost:5432/car_rental_test
      # The backend refuses to start without these, and the drill runs its
      # test suite against the restored database. Throwaway values: this
      # database lives only for the length of the job.
      SECRET_KEY: drill-placeholder-secret-key-not-for-production
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install postgresql-client-16
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-16

      - name: Download most recent backup
        env:
          BACKUP_STORAGE_ACCOUNT: ${{ vars.BACKUP_STORAGE_ACCOUNT }}
          BACKUP_CONTAINER_NAME: ${{ vars.BACKUP_CONTAINER_NAME }}
        run: |
          latest=$(az storage blob list \
            --auth-mode login \
            --account-name "$BACKUP_STORAGE_ACCOUNT" \
            --container-name "$BACKUP_CONTAINER_NAME" \
            --query "sort_by([], &properties.lastModified)[-1].name" -o tsv)
          echo "Restoring latest backup: $latest"
          az storage blob download \
            --auth-mode login \
            --account-name "$BACKUP_STORAGE_ACCOUNT" \
            --container-name "$BACKUP_CONTAINER_NAME" \
            --name "$latest" \
            --file restore.dump

      - name: Restore into throwaway database
        run: |
          pg_restore --no-owner --no-privileges \
            -d "postgresql://car_rental:car_rental_dev@localhost:5432/car_rental_test" \
            restore.dump

      - name: Apply migrations to restored database
        working-directory: backend
        run: alembic upgrade head

      - name: Verify restored data
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python ../deploy/backup/verify_restore.py

      # The app itself must be able to serve the restored data. The backend
      # test suite is deliberately not run here: it expects the seeded
      # development data, not a real business's records, so it would fail on
      # any restore of production and prove nothing about the backup.
      - name: Serve the restored database with the backend
        working-directory: backend
        env:
          ENVIRONMENT: production
        run: |
          uvicorn app.main:app --port 8000 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS http://127.0.0.1:8000/api/branding

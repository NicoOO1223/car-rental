name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# OIDC federated login — no long-lived Azure credential stored in GitHub.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Production runs Postgres 16, so test against the same major.
        image: postgres:16
        env:
          # The suite refuses to run on a database whose name does not end
          # in _test (see backend/tests/_test_database.py).
          POSTGRES_DB: car_rental_test
          POSTGRES_USER: car_rental
          POSTGRES_PASSWORD: car_rental_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U car_rental"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://car_rental:car_rental_dev@localhost:5432/car_rental_test
      SECRET_KEY: ci-placeholder-secret-key-not-for-production
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Seed reference data
        # The test suite exercises real seeded cars/locations/extras
        # (e.g. ensure_car_available("SA-008-AA")), not fixtures — the
        # CI Postgres service starts empty, so it needs the same seed
        # data local dev runs against.
        working-directory: backend
        run: python seed.py

      - name: Run backend test suite
        working-directory: backend
        run: pytest

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # build before typecheck, not after: `tsc --noEmit` alone resolves
      # Next.js's generated types (e.g. LayoutProps) from .next/types,
      # which only exists once `next build` (or `next dev`) has run at
      # least once. A fresh checkout has no .next dir, so typecheck-then-
      # build fails on a clean clone even with correct code. `next build`
      # itself already fails on real type errors (no ignoreBuildErrors
      # set in next.config.ts), so nothing is lost by reordering.
      - run: npm run build
      - run: npm run typecheck
      # Every language has the same messages with the same placeholders, and
      # every server error code has a message.
      - run: npm run check:messages

  deploy-backend:
    needs: backend-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install containerapp CLI extension
        run: az extension add --name containerapp --upgrade -y

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ vars.ACR_LOGIN_SERVER }}/backend:${{ github.sha }} \
            -f backend/Dockerfile backend
          docker push ${{ vars.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}

      - name: Deploy backend
        # Tagged with the commit SHA (not :latest) — Container Apps only
        # creates a new revision when the image reference string itself
        # changes, so a reused tag silently keeps serving the old image.
        run: |
          az containerapp update \
            --name car-rental-backend \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image ${{ vars.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}

  deploy-frontend:
    needs: frontend-checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install containerapp CLI extension
        run: az extension add --name containerapp --upgrade -y

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push frontend image
        # NEXT_PUBLIC_* vars are inlined into the client bundle at build
        # time, so they're passed as build args here, not runtime env vars.
        run: |
          docker build -t ${{ vars.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }} \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }} \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }} \
            -f frontend/Dockerfile frontend
          docker push ${{ vars.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name car-rental-frontend \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image ${{ vars.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}

  # Proves what was just deployed is actually serving, instead of trusting
  # that `az containerapp update` returning means the app works. Container
  # Apps also keeps a revision that fails its readiness probe out of traffic,
  # so a bad deploy leaves the previous revision serving; this job makes that
  # visible as a red run instead of a silent stale site.
  smoke-test:
    needs: [deploy-backend, deploy-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check the deployed backend and frontend
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
        run: |
          set -euo pipefail

          frontend_fqdn=$(az containerapp show \
            --name car-rental-frontend \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          frontend_url="https://${frontend_fqdn}"

          # A scaled-to-zero app needs time to start, and a new revision
          # needs time to become ready.
          wait_for() {
            local url="$1"
            for attempt in $(seq 1 30); do
              if curl -fsS -o /dev/null --max-time 20 "$url"; then
                echo "OK: $url"
                return 0
              fi
              echo "Waiting for $url (attempt $attempt)..."
              sleep 10
            done
            echo "FAILED: $url never became healthy"
            return 1
          }

          wait_for "$API_URL/ready"
          wait_for "$frontend_url/login"

          # The API must not expose its docs in production.
          docs_status=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/docs")
          if [ "$docs_status" != "404" ]; then
            echo "FAILED: $API_URL/docs returned $docs_status, expected 404"
            exit 1
          fi

          # Security headers are present on both sides.
          curl -fsS -D - -o /dev/null "$API_URL/health" | grep -qi '^x-content-type-options: nosniff' \
            || { echo "FAILED: backend is missing security headers"; exit 1; }
          curl -fsS -D - -o /dev/null "$frontend_url/login" | grep -qi '^content-security-policy-report-only' \
            || { echo "FAILED: frontend is missing its CSP header"; exit 1; }

          echo "Smoke test passed."

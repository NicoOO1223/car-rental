name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# OIDC federated login — no long-lived Azure credential stored in GitHub.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Production runs Postgres 16, so test against the same major.
        image: postgres:16
        env:
          # The suite refuses to run on a database whose name does not end
          # in _test (see backend/tests/_test_database.py).
          POSTGRES_DB: car_rental_test
          POSTGRES_USER: car_rental
          POSTGRES_PASSWORD: car_rental_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U car_rental"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://car_rental:car_rental_dev@localhost:5432/car_rental_test
      SECRET_KEY: ci-placeholder-secret-key-not-for-production
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Seed reference data
        # The test suite exercises real seeded cars/locations/extras
        # (e.g. ensure_car_available("SA-008-AA")), not fixtures — the
        # CI Postgres service starts empty, so it needs the same seed
        # data local dev runs against.
        working-directory: backend
        run: python seed.py

      - name: Run backend test suite
        working-directory: backend
        run: pytest

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # build before typecheck, not after: `tsc --noEmit` alone resolves
      # Next.js's generated types (e.g. LayoutProps) from .next/types,
      # which only exists once `next build` (or `next dev`) has run at
      # least once. A fresh checkout has no .next dir, so typecheck-then-
      # build fails on a clean clone even with correct code. `next build`
      # itself already fails on real type errors (no ignoreBuildErrors
      # set in next.config.ts), so nothing is lost by reordering.
      - run: npm run build
      - run: npm run typecheck
      # Every language has the same messages with the same placeholders, and
      # every server error code has a message.
      - run: npm run check:messages
      - run: npm run check:colors
      # Unit tests for the frontend helpers that carry logic (time zones,
      # translation, error wording, runtime settings).
      - run: npm test

  # The public storefront: types, build, catalogs and its unit tests. The
  # shared/ folder it imports is checked with it.
  storefront-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: storefront/package-lock.json

      - run: npm ci
      # Build first: the generated route types that tsc reads exist only after it.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check:messages
      - run: npm test

  # The main flow in a real browser, against a real API and a real database:
  # sign in, book a car, approve, take cash, record identity and signatures,
  # start the rental, return the car, and see it completed. It catches what
  # unit tests cannot: a screen that renders but cannot be used.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: car_rental_e2e
          POSTGRES_USER: car_rental
          POSTGRES_PASSWORD: car_rental_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U car_rental"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://car_rental:car_rental_dev@localhost:5432/car_rental_e2e
      SECRET_KEY: e2e-placeholder-secret-key-not-for-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      E2E_BASE_URL: http://localhost:3000
      E2E_STOREFRONT_URL: http://localhost:3001/en
      E2E_API_URL: http://localhost:8000
      E2E_EMAIL: e2e@example.com
      E2E_PASSWORD: e2e-password-1
      # A test-mode Stripe key, set as repository secrets, so the storefront's
      # own booking flow (e2e/storefront.spec.ts) can run for real. Left unset,
      # it stays green: that spec's transactional tests skip themselves.
      STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare the database and start the API
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          alembic upgrade head
          python seed.py
          python create_staff_user.py "$E2E_EMAIL" "$E2E_PASSWORD" --role admin
          uvicorn app.main:app --port 8000 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/ready > /dev/null && break
            sleep 2
          done

      - name: Build and start the frontend
        working-directory: frontend
        env:
          API_URL: http://localhost:8000
        run: |
          npm ci
          npm run build
          npx next start --port 3000 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/login > /dev/null && break
            sleep 2
          done

      - name: Build and start the storefront
        working-directory: storefront
        env:
          API_URL: http://localhost:8000
          STOREFRONT_URL: http://localhost:3001
        run: |
          npm ci
          npm run build
          npx next start --port 3001 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/health > /dev/null && break
            sleep 2
          done

      - name: Install the test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the flow tests (staff and storefront)
        working-directory: frontend
        run: npm run test:e2e

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/test-results
            frontend/playwright-report

  # Which stacks exist comes from deploy/stacks/*.json. The canary goes first.
  plan:
    runs-on: ubuntu-latest
    outputs:
      canary: ${{ steps.stacks.outputs.canary }}
      others: ${{ steps.stacks.outputs.others }}
      registry: ${{ steps.stacks.outputs.registry }}
    steps:
      - uses: actions/checkout@v7

      - id: stacks
        run: |
          set -euo pipefail
          all=$(jq -s '.' deploy/stacks/*.json)
          echo "canary=$(echo "$all" | jq -c '[.[] | select(.canary) | .slug]')" >> "$GITHUB_OUTPUT"
          echo "others=$(echo "$all" | jq -c '[.[] | select(.canary | not) | .slug]')" >> "$GITHUB_OUTPUT"
          echo "registry=$(jq -r .registryName deploy/shared.json)" >> "$GITHUB_OUTPUT"

  # The images are built once and shared by every stack.
  build:
    needs: [backend-tests, frontend-checks, storefront-checks, e2e, plan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the shared registry
        run: az acr login --name ${{ needs.plan.outputs.registry }}

      - name: Build and push the images
        run: |
          registry=${{ needs.plan.outputs.registry }}.azurecr.io
          docker build -t "$registry/backend:${{ github.sha }}" -f backend/Dockerfile backend
          docker push "$registry/backend:${{ github.sha }}"
          docker build -t "$registry/frontend:${{ github.sha }}" -f frontend/Dockerfile frontend
          docker push "$registry/frontend:${{ github.sha }}"
          # From the repository root: the storefront imports the shared/ folder.
          docker build -t "$registry/storefront:${{ github.sha }}" -f storefront/Dockerfile .
          docker push "$registry/storefront:${{ github.sha }}"

  # The operator's own stack first: a bad migration or a broken build stops
  # here, before any customer stack sees it. Each job runs inside its stack's
  # GitHub Environment, so it uses that stack's credentials and settings.
  deploy-canary:
    needs: [plan, build]
    runs-on: ubuntu-latest
    environment: stack-${{ matrix.stack }}
    strategy:
      matrix:
        stack: ${{ fromJson(needs.plan.outputs.canary) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/deploy-stack
        with:
          image-tag: ${{ github.sha }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group: ${{ vars.RESOURCE_GROUP }}
          acr-login-server: ${{ vars.ACR_LOGIN_SERVER }}
          api-url: ${{ vars.API_URL }}
          frontend-url: ${{ vars.FRONTEND_URL }}
          stripe-publishable-key: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          sentry-dsn: ${{ vars.SENTRY_DSN }}
          business-name: ${{ vars.BUSINESS_NAME }}
          app-prefix: ${{ vars.APP_PREFIX || 'car-rental' }}
          storefront-url: ${{ vars.STOREFRONT_URL }}
          turnstile-site-key: ${{ vars.TURNSTILE_SITE_KEY }}

  # Then the rest, one at a time, stopping at the first failure.
  deploy-others:
    needs: [plan, deploy-canary]
    if: needs.plan.outputs.others != '[]'
    runs-on: ubuntu-latest
    environment: stack-${{ matrix.stack }}
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        stack: ${{ fromJson(needs.plan.outputs.others) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/deploy-stack
        with:
          image-tag: ${{ github.sha }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group: ${{ vars.RESOURCE_GROUP }}
          acr-login-server: ${{ vars.ACR_LOGIN_SERVER }}
          api-url: ${{ vars.API_URL }}
          frontend-url: ${{ vars.FRONTEND_URL }}
          stripe-publishable-key: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          sentry-dsn: ${{ vars.SENTRY_DSN }}
          business-name: ${{ vars.BUSINESS_NAME }}
          app-prefix: ${{ vars.APP_PREFIX || 'car-rental' }}
          storefront-url: ${{ vars.STOREFRONT_URL }}
          turnstile-site-key: ${{ vars.TURNSTILE_SITE_KEY }}

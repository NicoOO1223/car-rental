name: Deploy one stack

# Called by deploy.yml, once for the canary stack and then for the others.
# Runs inside the stack's own GitHub Environment (stack-<slug>), so it logs in
# to Azure with that stack's credentials and reads that stack's variables. The
# images were built once and are shared by every stack; nothing stack-specific
# is baked into them.

on:
  workflow_call:
    inputs:
      stack:
        description: Stack slug, as in deploy/stacks/<slug>.json
        required: true
        type: string
      image_tag:
        description: Tag of the images to deploy (the commit SHA)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: stack-${{ inputs.stack }}
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      API_URL: ${{ vars.API_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      BUSINESS_NAME: ${{ vars.BUSINESS_NAME }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install containerapp CLI extension
        run: az extension add --name containerapp --upgrade -y

      # Tagged with the commit SHA (not :latest): Container Apps only creates
      # a new revision when the image reference string itself changes, so a
      # reused tag silently keeps serving the old image.
      - name: Deploy backend
        run: |
          az containerapp update \
            --name car-rental-backend \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/backend:$IMAGE_TAG"

      # The frontend's stack-specific settings are set on every deploy from
      # this environment's variables, so they always match what the pipeline
      # was told and cannot drift from the app.
      - name: Deploy frontend
        run: |
          az containerapp update \
            --name car-rental-frontend \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/frontend:$IMAGE_TAG" \
            --set-env-vars \
              "API_URL=$API_URL" \
              "STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY" \
              "SENTRY_DSN=$SENTRY_DSN"

      - name: Smoke test
        run: bash deploy/smoke-test.sh "$API_URL" "$FRONTEND_URL" "$BUSINESS_NAME"

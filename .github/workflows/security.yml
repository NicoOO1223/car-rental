name: Dependency audit

# Deliberately separate from deploy.yml: an advisory published overnight
# should raise a flag, not block an unrelated deploy. It runs weekly, on
# every pull request that touches dependencies, and on demand.
on:
  schedule:
    - cron: "23 4 * * 1"
  pull_request:
    paths:
      - backend/requirements*.txt
      - frontend/package.json
      - frontend/package-lock.json
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Production dependencies only; test tooling is not shipped.
      - run: pip-audit -r backend/requirements.txt

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

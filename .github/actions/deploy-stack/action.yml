name: Deploy one stack
description: >
  Rolls the images built for a commit out to one customer stack and smoke-tests
  it. Run from a job that has `environment: stack-<slug>`, whose variables and
  secrets are handed in as inputs (a composite action cannot read them itself).

inputs:
  image-tag:
    description: Tag of the images to deploy (the commit SHA)
    required: true
  client-id:
    required: true
  tenant-id:
    required: true
  subscription-id:
    required: true
  resource-group:
    required: true
  acr-login-server:
    required: true
  api-url:
    required: true
  frontend-url:
    required: true
  stripe-publishable-key:
    required: false
    default: ""
  sentry-dsn:
    required: false
    default: ""
  business-name:
    required: false
    default: ""
  # Set only on a stack that has a public storefront (provision.ps1 records it).
  storefront-url:
    required: false
    default: ""
  turnstile-site-key:
    required: false
    default: ""
  # Every stack's apps are named "car-rental-<app>", except a stack sharing
  # another one's Container Apps environment (see provision.ps1's
  # sharedEnvironmentStack) — its names get its own slug worked in instead,
  # since ingress names must be unique across everything sharing one
  # environment. provision.ps1 sets this as the APP_PREFIX GitHub variable
  # only for such a stack; every other stack leaves it unset.
  app-prefix:
    required: false
    default: "car-rental"

runs:
  using: composite
  steps:
    - uses: azure/login@v2
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}

    - name: Install containerapp CLI extension
      shell: bash
      run: az extension add --name containerapp --upgrade -y

    # Tagged with the commit SHA (not :latest): Container Apps only creates a
    # new revision when the image reference string itself changes, so a reused
    # tag silently keeps serving the old image.
    - name: Deploy backend
      shell: bash
      run: |
        az containerapp update \
          --name "${{ inputs.app-prefix }}-backend" \
          --resource-group "${{ inputs.resource-group }}" \
          --image "${{ inputs.acr-login-server }}/backend:${{ inputs.image-tag }}"

    # The frontend's stack-specific settings are set on every deploy from the
    # environment's variables, so they always match what the pipeline was told
    # and cannot drift from the app. An empty value is left as it is.
    - name: Deploy frontend
      shell: bash
      env:
        STRIPE_PUBLISHABLE_KEY: ${{ inputs.stripe-publishable-key }}
        SENTRY_DSN: ${{ inputs.sentry-dsn }}
      run: |
        vars=("API_URL=${{ inputs.api-url }}")
        [ -n "$STRIPE_PUBLISHABLE_KEY" ] && vars+=("STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY")
        [ -n "$SENTRY_DSN" ] && vars+=("SENTRY_DSN=$SENTRY_DSN")
        az containerapp update \
          --name "${{ inputs.app-prefix }}-frontend" \
          --resource-group "${{ inputs.resource-group }}" \
          --image "${{ inputs.acr-login-server }}/frontend:${{ inputs.image-tag }}" \
          --set-env-vars "${vars[@]}"

    # A stack without a storefront skips these. The sweeper job runs the same
    # image as the backend, so it is rolled out with it.
    - name: Deploy storefront and hold sweeper
      if: inputs.storefront-url != ''
      shell: bash
      env:
        STRIPE_PUBLISHABLE_KEY: ${{ inputs.stripe-publishable-key }}
        TURNSTILE_SITE_KEY: ${{ inputs.turnstile-site-key }}
        SENTRY_DSN: ${{ inputs.sentry-dsn }}
      run: |
        vars=("API_URL=${{ inputs.api-url }}" "STOREFRONT_URL=${{ inputs.storefront-url }}")
        [ -n "$STRIPE_PUBLISHABLE_KEY" ] && vars+=("STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY")
        [ -n "$TURNSTILE_SITE_KEY" ] && vars+=("TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY")
        [ -n "$SENTRY_DSN" ] && vars+=("SENTRY_DSN=$SENTRY_DSN")
        az containerapp update \
          --name "${{ inputs.app-prefix }}-storefront" \
          --resource-group "${{ inputs.resource-group }}" \
          --image "${{ inputs.acr-login-server }}/storefront:${{ inputs.image-tag }}" \
          --set-env-vars "${vars[@]}"
        az containerapp job update \
          --name "${{ inputs.app-prefix }}-sweeper" \
          --resource-group "${{ inputs.resource-group }}" \
          --image "${{ inputs.acr-login-server }}/backend:${{ inputs.image-tag }}"

    - name: Smoke test
      shell: bash
      run: bash deploy/smoke-test.sh "${{ inputs.api-url }}" "${{ inputs.frontend-url }}" "${{ inputs.business-name }}" "${{ inputs.storefront-url }}"
